<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Демо-изображение: команда за совместной работой">
  <!-- Демо-фото живых примеров полигона (ui-image, модификаторы cover и
       ratio-16-9): топикальная векторная сцена в палитре системы, пропорция
       4:3 исходника отличается от бокса 16 к 9 — cover кадрирует (демо
       поведения из README). -->
  <rect width="640" height="480" fill="#F1F5FE"/>
  <!-- окно с городом -->
  <rect x="60" y="60" width="240" height="150" rx="6" fill="#E8EEFE"/>
  <path d="M60 210h240" stroke="#C4CDDC" stroke-width="4"/>
  <rect x="84" y="120" width="34" height="90" fill="#C4CDDC"/>
  <rect x="132" y="96" width="34" height="114" fill="#8F9CBF"/>
  <rect x="180" y="132" width="34" height="78" fill="#C4CDDC"/>
  <rect x="228" y="108" width="34" height="102" fill="#8F9CBF"/>
  <!-- стол -->
  <rect x="40" y="300" width="560" height="24" rx="8" fill="#002856"/>
  <rect x="90" y="324" width="20" height="130" fill="#164B89"/>
  <rect x="530" y="324" width="20" height="130" fill="#164B89"/>
  <!-- ноутбуки -->
  <rect x="150" y="252" width="110" height="70" rx="6" fill="#164B89"/>
  <rect x="158" y="260" width="94" height="54" rx="3" fill="#F1F5FE"/>
  <path d="M158 287h94" stroke="#F26722" stroke-width="6"/>
  <rect x="380" y="252" width="110" height="70" rx="6" fill="#164B89"/>
  <rect x="388" y="260" width="94" height="54" rx="3" fill="#F1F5FE"/>
  <path d="M388 287h94" stroke="#164B89" stroke-width="6"/>
  <!-- команда: три человека -->
  <circle cx="140" cy="228" r="22" fill="#F26722"/>
  <path d="M114 258c0-16 12-26 26-26s26 10 26 26v42h-52Z" fill="#F26722"/>
  <circle cx="320" cy="216" r="22" fill="#002856"/>
  <path d="M294 246c0-16 12-26 26-26s26 10 26 26v54h-52Z" fill="#002856"/>
  <circle cx="500" cy="228" r="22" fill="#F26722"/>
  <path d="M474 258c0-16 12-26 26-26s26 10 26 26v42h-52Z" fill="#F26722"/>
  <!-- общий экран-доска справа -->
  <rect x="440" y="80" width="140" height="96" rx="6" fill="#002856"/>
  <path d="M456 152h30M456 132h66M456 112h48" stroke="#F1F5FE" stroke-width="8" stroke-linecap="round"/>
  <path d="M510 176v18h-40" stroke="#164B89" stroke-width="10" stroke-linecap="round"/>
</svg>
