<!--
  Паттерн «Header» (T7.6; каркас — паттерн-слой с T17.13): референс-разметка
  шапки сайта — skip-link (T3.5) + header-лендмарка (banner) + nav-лендмарки
  с уникальными aria-label + dropdown (T6.1) + логотип (T4.6) + кнопка VI
  (T9.1) + поиск. Источник решений — header.html career-portal: переносится
  КОМПОЗИЦИЯ, не бренд-визуал.

  Границы (patterns/README.md, 02-architecture §7): каркас шапки — связки
  hsp-* в ПАТТЕРН-СЛОЕ (patterns/patterns.css → опциональный
  dist/ui-patterns.css, T17.13 — прецедент таймлайна T17.10): сетка
  «меню — логотип — меню» 1fr auto 1fr, режимы static / --overlay, nowrap-
  пункты, слоты логотипа и действия. <style> в док-HTML больше нет (пин
  синхронности patterns-layer.test.js). Бренд-специфика — сайт-зона
  (в бою — template_styles.css): VI-пилюля (15px, рамка primary, glass-light
  career-portal — на слоте hsp__action поверх общего вида кнопки), размеры
  логотипа, letter-spacing 0.01em пунктов (оговорка пилота).

  Режимы (слой): базовый hsp — static с рамкой низа muted (внутренние
  страницы); hsp--overlay — absolute поверх контента главной (z-40, без
  рамки/фона — фон несёт hero). Здесь показан базовый; overlay — та же
  разметка с классом hsp--overlay (пример — каркас главной career-portal).

  Разметка ставится НА УРОВНЕ body: skip-link → header → main → footer —
  тогда у шапки честная роль banner (внутри main роли banner нет).

  Dropdown — навигационное назначение T6.1: меню это <nav> с <ul>/<li>/<a>,
  БЕЗ role="menu"; в разметке меню раскрыто (hidden/aria-expanded ставит
  модуль) — без JS все ссылки доступны (README ui-dropdown).

  Диалог поиска внизу сниппета — пара к триггеру «Поиск»; разметка диалога —
  из паттерна search-overlay (T7.6, источник правды — он); в бою держите её
  перед </body> (README ui-modal, Bitrix).
-->
<!-- Skip-link (T3.5): первый элемент body, до шапки и любого контента;
     цель — <main id="main" tabindex="-1"> (ставит каркас страницы). -->
<a class="ui-skip-link" href="#main">Перейти к основному содержимому</a>

<header class="hsp">
  <div class="ui-container hsp__inner">
    <!-- Основная навигация: nav-лендмарка с aria-label (лендмарк должен
         иметь имя, когда их несколько). Dropdown T6.1: nav > ul > li > a,
         без role="menu" (ссылки-переходы — не команды). -->
    <nav class="hsp__menu hsp__menu--left" aria-label="Основное меню">
      <!-- Пункты навигации — ui-link--nav (T16.3): fs-small/fw-small, без
           подчёркивания (структурный контекст nav — WCAG 1.4.1 допускает);
           inline-ссылки контента остаются на default ui-link. Строки с
           иконкой и nowrap-режим несёт каркас (.hsp__menu .ui-link). -->
      <a class="ui-link ui-link--nav" href="/vacancies/">Вакансии</a>

      <div class="ui-dropdown" data-ui-dropdown>
        <button class="ui-dropdown__trigger" type="button" id="hdp-sections-trigger">
          Школьникам и студентам
          <svg
            class="ui-dropdown__icon"
            aria-hidden="true"
            focusable="false"
            width="16"
            height="16"
            viewBox="0 0 16 16"
          >
            <path
              d="M3 6l5 5 5-5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            ></path>
          </svg>
        </button>
        <nav class="ui-dropdown__menu" id="hdp-sections-menu" aria-label="Школьникам и студентам">
          <ul class="ui-dropdown__list">
            <li><a class="ui-dropdown__item" href="/practices/">Стажировки и практики</a></li>
            <li><a class="ui-dropdown__item" href="/education/">Целевое обучение</a></li>
            <li><a class="ui-dropdown__item" href="/events/">Каталог мероприятий</a></li>
          </ul>
        </nav>
      </div>

      <a class="ui-link ui-link--nav" href="/media/">Медиа</a>
    </nav>

    <!-- Логотип (T4.6): ссылка на главную с доступным именем. Демо —
         инлайновый svg + текст (без внешних файлов); в бою — img по правилам
         T4.6: alt + width/height (см. README паттерна). Размеры img —
         сайт-зона (у career-portal 105px). -->
    <a class="hsp__logo" href="/" aria-label="Интер РАО — на главную">
      <svg
        aria-hidden="true"
        focusable="false"
        width="32"
        height="32"
        viewBox="0 0 32 32"
      >
        <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2"></circle>
        <path
          d="M9 20h14"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        ></path>
        <path
          d="M12 12h8"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        ></path>
      </svg>
      <span>Интер РАО</span>
    </a>

    <!-- Дополнительная навигация: aria-label отличается от основной —
         лендмарки navigation различимы скринридеру (Accessibility
         requirements T7.6). Кнопка VI (T9.1) — на каждой странице, вид —
         слот hsp__action (общий вид кнопки несёт слой, бренд-оболочка —
         сайт). В мобильной базе правое меню скрыто — канон оригинала
         (≤767, ступень каркаса). -->
    <nav class="hsp__menu hsp__menu--right" aria-label="Дополнительное меню">
      <button class="hsp__action" type="button" data-ui-vi-toggle aria-pressed="false">
        <svg
          aria-hidden="true"
          focusable="false"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
        >
          <path
            d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7Z"
            stroke="currentColor"
            stroke-width="2"
          ></path>
          <circle cx="12" cy="12" r="3.4" stroke="currentColor" stroke-width="2"></circle>
        </svg>
        <span>Версия для слабовидящих</span>
      </button>
      <a class="ui-link ui-link--nav" href="/contacts/">Контакты</a>

      <!-- Поиск: триггер-ссылка к диалогу search-overlay (T7.6) —
           без JS переход на страницу результатов, с JS модуль откроет
           диалог (он в конце сниппета). -->
      <a class="ui-link ui-link--nav" href="/search/" data-ui-modal-target="sop-dialog">
        <svg
          aria-hidden="true"
          focusable="false"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
        >
          <circle cx="10.5" cy="10.5" r="7" stroke="currentColor" stroke-width="2"></circle>
          <path d="M16 16l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
        </svg>
        Поиск
      </a>
    </nav>
  </div>
</header>

<!--
  Диалог поиска — копия паттерна search-overlay (T7.6): в бою держите перед
  </body>; здесь — рядом с шапкой для самодостаточности сниппета. Подробная
  дока и связки (sop-*) — patterns/search-overlay/.

  Don't (ловушка дублей id): на странице ровно ОДИН диалог sop-dialog/sop-query.
  Если паттерн search-overlay уже подключён (тот же id в include-файле/footer),
  удалите копию из шапки — при дублях data-ui-modal-target откроет только
  первый диалог, а html-validate no-duplicate-id поймает копию уже в бою.
-->
<dialog
  class="ui-modal ui-modal--full"
  id="sop-dialog"
  open
  data-ui-modal
  aria-labelledby="sop-title"
>
  <button class="ui-modal__close" type="button" aria-label="Закрыть">
    <svg
      class="ui-modal__icon"
      aria-hidden="true"
      focusable="false"
      width="24"
      height="24"
      viewBox="0 0 24 24"
    >
      <path
        d="M6 6l12 12M18 6L6 18"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      ></path>
    </svg>
  </button>
  <h2 class="ui-modal__title ui-h3" id="sop-title">Поиск по сайту</h2>
  <div class="ui-modal__body">
    <form class="sop-form" action="/search/" method="get" role="search">
      <div class="ui-field">
        <label class="ui-field__label" for="sop-query">Поисковый запрос</label>
        <!-- prettier-ignore -->
        <input
          class="ui-field__input"
          type="search"
          id="sop-query"
          name="q"
          placeholder="Например: стажировка в Москве"
          autocomplete="off"
        >
      </div>
      <button class="ui-button ui-button--primary" type="submit">Найти</button>
    </form>
  </div>
</dialog>

<script>
  // Фокус в поле при открытии — сниппет паттерна search-overlay (T7.6):
  // модуль даёт первый фокус закрывающей кнопке, сайт переносит его в поле
  // по событию irao-ui:modal-open.
  (function () {
    var dialog = document.getElementById('sop-dialog');
    if (!dialog) return;
    dialog.addEventListener('irao-ui:modal-open', function () {
      var input = document.getElementById('sop-query');
      if (input && typeof input.focus === 'function') {
        input.focus();
      }
    });
  })();
</script>
