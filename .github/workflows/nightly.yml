# Ночной контур irao-ui — детерминированная часть nightly-цикла.
# Паттерн: health-log/.github/workflows/eval-nightly.yml (TASK-092):
#   ОТДЕЛЬНЫЙ контур — триггеров pull_request/push нет, красная ночь НЕ блокирует
#   PR-пайплайн (сегрегация осознанная); красный прогон = investigate.
#   Протокол всего ночного цикла (включая AI-ревью агентом code-reviewer и
#   обязательные правки CRITICAL/HIGH): docs/process/nightly-review-protocol.md.
#
# Сегодня: validate-backlog (битые ссылки/orphan-задачи/пропущенные секции
# task-файлов; без внешних пакетов) + контраст-гейт AA (T2.3, без пакетов) +
# unit (vitest, T1.6 — с npm ci).
# Эволюция (по плану docs/ui-system/):
#   T1.2 — добавить шаги lint (stylelint/eslint/prettier/html-validate);
#   T1.5 (готово) — матрица chromium/firefox/webkit добавлена (e2e-matrix,
#               контейнер Playwright-образа, ADR-0004); PR-гейты — ci.yml;
#   T2.3 — contrast-гейт переезжает в ci.yml как mandatory PR-гейт (06 §7,
#               спека T2.3: «шаг в ci.yml»; на момент T2.3 ci.yml ещё нет);
#   T3.6 (готово) — шрифто-зум-гейт масштабирования (tests/e2e/scaling.spec.js:
#               zoom 200% — chromium, 32px-база — все браузеры) исполняется
#               полным прогоном e2e-matrix ниже; VI-smoke (T9.1) — следующим.
name: Nightly cycle

on:
  # Ночь 03:00 UTC-независимо от локальной машины — дешёвый детектор деградации.
  schedule:
    - cron: '0 3 * * *'
  # Ручной прогон — приёмка контура и после изменений проверок.
  workflow_dispatch:

# Минимальные права (паттерн health-log): проверка только читает репозиторий.
permissions:
  contents: read

# Новый ночной прогон отменяет устаревший.
concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  nightly:
    name: Nightly validate
    runs-on: ubuntu-latest
    # Бюджет прогона небольшой; 15 мин — аварийный предел.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Валидатор — node-скрипт (без зависимостей); bash-версия удалена 05.10:
      # на Windows-машине владельца спавн bash уходил в WSL-релей.
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Красный exit-код фиксируется (continue-on-error), чтобы отчёт и артефакт
      # грузились всегда — как «Eval report» в health-log (if: always()).
      - name: Validate backlog (links / orphans / sections)
        id: validate
        continue-on-error: true
        run: |
          node tools/validate-backlog.mjs | tee nightly-report.txt

      # T1.5: структурная валидация воркфлоу (контракты CI-конвейера).
      - name: Validate workflows
        id: workflows
        continue-on-error: true
        run: |
          node tools/validate-workflows.mjs | tee workflows-report.txt

      # T2.3: контраст-гейт AA — node-скрипт без зависимостей (до npm ci):
      # пары «использование → фон» из tokens/*, пороги WCAG AA, markdown-отчёт
      # (артефакт ниже). Нарушение порога или цветовой токен слоя 2 без пары —
      # exit 1 (красная ночь); в ci.yml (T1.5) шаг станет mandatory PR-гейтом.
      - name: Contrast check (AA)
        id: contrast
        continue-on-error: true
        run: |
          node tests/contrast/check.mjs --report contrast-report.md

      # T1.6: юнит-слой — Vitest + jsdom (DOM-независимая логика модулей и
      # guard'ы; эталонный тест docs/templates/module-template.js).
      # Зависимости нужны только этому шагу: validate — node-скрипт без пакетов.
      - name: Install dependencies
        run: npm ci

      - name: Unit tests (vitest)
        id: unit
        continue-on-error: true
        run: npm run test:unit

      # Отчёт — в Job Summary (паттерн health-log §18).
      - name: Report to job summary
        if: always()
        run: |
          {
            echo "# Nightly cycle report"
            echo
            if [ -f nightly-report.txt ]; then cat nightly-report.txt; else echo "validate: отчёт не создан (прогон упал до отчёта)"; fi
            echo
            echo "workflows (структура CI-конвейера): ${{ steps.workflows.outcome }}"
            echo
            if [ -f workflows-report.txt ]; then cat workflows-report.txt; else echo "workflows: отчёт не создан (прогон упал до отчёта)"; fi
            echo
            echo "contrast (AA): ${{ steps.contrast.outcome }}"
            echo
            if [ -f contrast-report.md ]; then cat contrast-report.md; else echo "contrast: отчёт не создан (прогон упал до отчёта)"; fi
            echo
            echo "unit (vitest): ${{ steps.unit.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

      # Артефакты — грузятся и при красном прогоне.
      - name: Upload nightly report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-report
          path: |
            nightly-report.txt
            workflows-report.txt
            contrast-report.md
          if-no-files-found: warn

      # Явный статус job'а: красный validate, workflows, contrast или unit =
      # красная ночь (investigate, PR не блокирует).
      - name: Fail on validation problems
        if: steps.validate.outcome == 'failure' || steps.workflows.outcome == 'failure' || steps.contrast.outcome == 'failure' || steps.unit.outcome == 'failure'
        run: |
          echo "nightly: обнаружены проблемы (см. Job Summary и артефакт) — investigate по протоколу docs/process/nightly-review-protocol.md"
          exit 1

  # Матрица браузеров (T1.5; 02-architecture §10): полный прогон e2e+axe на
  # chromium/firefox/webkit в пиннутом Playwright-образе (ADR-0004; пин —
  # package.json iraoUi.playwrightImage, контроль — tools/validate-workflows.mjs).
  # Ночь — не гейт PR (сегрегация осознанная, см. шапку): красная нога =
  # красная ночь = investigate. Эталоны не пишутся и не сравниваются
  # (IRAO_SNAPSHOTS не задан, харнесс): поведение проверяют, визуал —
  # chromium в ci.yml (advisory) и update-snapshots.yml.
  e2e-matrix:
    name: Matrix ${{ matrix.browser }} (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit
    container: mcr.microsoft.com/playwright:v1.63.0-jammy # пин — package.json iraoUi.playwrightImage
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build showcase
        run: npm run build

      # Полный прогон несёт и релизный гейт масштабирования T3.6
      # (tests/e2e/scaling.spec.js: zoom 200% — chromium-проект, 32px-база —
      # все браузеры матрицы; пороги и контракт data-ui-check-layout —
      # tests/e2e/README.md). Красный шаг = красная ночь (investigate).
      - name: Playwright (${{ matrix.browser }})
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.browser }}-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
