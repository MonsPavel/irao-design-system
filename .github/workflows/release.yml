# Релизный конвейер irao-ui — БОЕВОЙ РЕЖИМ (T12.1; каркас — T1.5).
#
# Тег v* → гейты → матрица → VI-smoke → build-dist (zip §6.1) → GitHub Release.
#
# Джобы (все блокирующие — красная джоба красит релиз; job-level
# continue-on-error запрещён, структура проверяется
# tools/validate-workflows.mjs на каждый PR):
#   gates      — changelog-запись тега + версия package.json = тегу
#                (tools/release-gate.mjs; ADR-0007: «CI блокирует релиз без
#                changelog-записи»; баннеры dist = тег — T1.3) и протокол
#                скринридеров (T9.2: «релиз T12.1 обязан запускать его и
#                получать exit 0»);
#   matrix     — полный прогон chromium/firefox/webkit в пиннутом
#                Playwright-образе (ADR-0004; chromium сравнивает эталоны —
#                релизная точка обязана быть визуально чистой). Гейт
#                масштабирования T3.6 (tests/e2e/scaling.spec.js: zoom 200% —
#                chromium, 32px-база — все браузеры) входит в полный прогон
#                матрицы: красная матрица БЛОКИРУЕТ релиз;
#   vi-smoke   — релизный smoke доступности (T9.1/T9.2): VI-включение, темы,
#                персистентность (tests/e2e/ui-vi.spec.js) и axe-обход ВСЕХ
#                страниц полигона (tests/a11y/stands-sweep.spec.js);
#   build-dist — npm run build → zip dist (ui-core/ui-vi/ui.min.js + ui.dev.js
#                (T12.2) + fonts/ + themes/ — 02-architecture §6.1) → проверка
#                содержимого в джобе → upload-artifact;
#   release    — GitHub Release через gh CLI (allowlist first-party actions —
#                сторонних нет): артефакт + release notes = запись тега из
#                CHANGELOG.md. Только на тегах: workflow_dispatch — репетиция
#                конвейера без публикации (права contents: write — только у
#                этой джобы).
#
# Логика гейтов — tools/release-gate-lib.mjs (юнит-пин
# tests/unit/release-gate.test.js); CHANGELOG.md репозитория заводится T12.2 —
# до её выполнения тег честно красный на гейте («записи нет»).
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    name: Release gates (changelog / version / protocol)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Гейт тега: запись в CHANGELOG.md и версия = тегу. На workflow_dispatch
      # (репетиция без тега) проверять нечего — шаг пропускается; на теге —
      # блокирующий (шаг без continue-on-error).
      - name: Changelog + version gate (ADR-0007, T1.3)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node tools/release-gate.mjs

      # T9.2: релиз обязан получать exit 0 по протоколу скринридеров
      # (docs/ui-system/a11y/screen-reader-protocol.md — ручной артефакт;
      # состояние «ожидает ручного прогона» = exit 1 = релиз заблокирован —
      # честный статус до подписания прогона). Пропуск — только вне тега.
      - name: Screen-reader protocol gate (T9.2)
        if: startsWith(github.ref, 'refs/tags/v')
        run: node tests/a11y/protocol-gate.mjs

  matrix:
    name: Matrix (${{ matrix.browser }}, контейнер)
    needs:
      - gates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy # пин — package.json iraoUi.playwrightImage; контроль — tools/validate-workflows.mjs
      # uid 1001 (pwuser образа) — официальный рецепт Playwright для GH Actions
      # container-джоб: HOME=/github/home смонтирован с владельцем uid 1001, и
      # запуск от root валит Firefox; воспроизведено и проверено в том же
      # образе (приёмка T12.1 — релизная матрица обязана быть запускаемой).
      options: --user 1001
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build showcase
        run: npm run build

      # IRAO_SNAPSHOTS=1: chromium сверяет эталоны (цветовой порог нулевой —
      # ADR-0004, допуск maxDiffPixels 8 на AA-шум скруглений);
      # firefox/webkit проверяют поведение, скриншоты у них no-op (харнесс).
      # В полный прогон входит релизный гейт масштабирования T3.6
      # (tests/e2e/scaling.spec.js): падение валит матрицу — релиз блокирован.
      - name: Playwright (${{ matrix.browser }})
        env:
          IRAO_SNAPSHOTS: '1'
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.browser }}-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  vi-smoke:
    name: Release smoke (VI-включение + axe-обход стендов, T9.1/T9.2)
    needs:
      - matrix
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-jammy # пин — package.json iraoUi.playwrightImage; контроль — tools/validate-workflows.mjs
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build showcase
        run: npm run build

      # Релизный smoke доступности (Accessibility requirements T12.1): VI
      # включается, классы/темы/aria-pressed/localStorage работают
      # (ui-vi.spec.js), и весь полигон чист по axe (stands-sweep — обход
      # всех стендов, T9.2). IRAO_SNAPSHOTS не задан: smoke проверяет
      # поведение, эталоны уже сверены в matrix (chromium).
      - name: VI-smoke (chromium)
        run: npx playwright test tests/e2e/ui-vi.spec.js tests/a11y/stands-sweep.spec.js --project=chromium

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-vi-smoke-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  build-dist:
    name: Dist artifact (zip §6.1)
    needs:
      - matrix
      - vi-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build dist + showcase
        run: npm run build

      # Имя zip константное (ревью T12.1 high): на workflow_dispatch ref_name —
      # имя ветки с «/» (конвенция task/T12.1) — zip не создаёт каталоги-родители
      # («irao-ui-dist-task/T12.1.zip» — несуществующий путь), а upload-artifact
      # v4 отклоняет имена с «/». Версия появляется в имени ассета Release
      # (джоба release — только теги, ref_name = vX.Y.Z).
      - name: Zip dist
        run: zip -r irao-ui-dist.zip dist

      # Проверка содержимого артефакта в джобе (implementation requirements 1):
      # полный dist по 02-architecture §6.1 — ui-core/ui-vi/ui.min.js +
      # ui.dev.js (T12.2) + fonts/ + themes/. Баннер версии сверяется с
      # package.json — на теге гейт gates уже гарантировал совпадение версии
      # с тегом, значит в артефакте = тег.
      - name: Verify zip structure (02-architecture §6.1) and banner (T1.3)
        run: |
          ZIP="irao-ui-dist.zip"
          CONTENT="$(unzip -l "$ZIP")"
          for path in dist/ui-core.min.css dist/ui-vi.min.css dist/ui.min.js dist/ui.dev.js dist/fonts/ dist/themes/; do
            if ! echo "$CONTENT" | grep -qF "$path"; then
              echo "zip-артефакт не соответствует 02-architecture §6.1: нет $path"
              exit 1
            fi
          done
          VERSION="$(node -p 'require("./package.json").version')"
          if ! unzip -p "$ZIP" dist/ui-core.min.css | head -1 | grep -qF "irao-ui v${VERSION}"; then
            echo "баннер версии dist не содержит irao-ui v${VERSION} (на теге это значит: баннер ≠ тег)"
            exit 1
          fi
          echo "zip ok: структура §6.1 и баннер irao-ui v${VERSION}"

      - name: Upload dist-zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-release
          path: irao-ui-dist.zip
          if-no-files-found: error

  release:
    name: GitHub Release (артефакт + changelog-запись)
    needs:
      - build-dist
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # публикация Release — единственная запись в репозиторий конвейера
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Повторное применение гейта + тело release notes = запись тега из
      # CHANGELOG.md (--extract): публикация Release без changelog-записи
      # невозможна по построению (ADR-0007).
      - name: Extract release notes from CHANGELOG
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node tools/release-gate.mjs --extract > release-notes.md

      - name: Download dist-zip artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-release # константное имя — совпадает с upload в build-dist
          path: artifact

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          # Имя ассета с версией: джоба — только теги (guard выше), ref_name =
          # vX.Y.Z без «/» — безопасно для имени файла (ревью T12.1 high).
          cp "artifact/irao-ui-dist.zip" "irao-ui-dist-${GITHUB_REF_NAME}.zip"
          gh release create "$GITHUB_REF_NAME" --title "irao-ui ${GITHUB_REF_NAME}" --notes-file release-notes.md "irao-ui-dist-${GITHUB_REF_NAME}.zip"
