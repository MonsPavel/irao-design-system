# Деплой showcase на GitHub Pages (задача T1.5; docs/02-architecture.md §10).
#
# Триггер workflow_run: CI (ci.yml) завершился на main — деплой выполняется
# ТОЛЬКО при conclusion == 'success' («Pages-деплой из main только после
# зелёного CI», технические требования T1.5). workflow_dispatch — ручной
# запуск для восстановления Pages.
#
# Полигон showcase/dist генерируется сборкой (npm run build, детерминирован —
# баннер версия+sha без меток времени). .nojekyll — без Jekyll-обработки.
# Структура деплоя — по референсу career-portal deploy.yml (стек другой:
# Node/esbuild вместо Python).
name: Pages

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy showcase (GitHub Pages)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build showcase
        run: npm run build

      - name: Disable Jekyll processing
        run: touch showcase/dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: showcase/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
