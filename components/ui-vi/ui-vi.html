<!-- ui-vi (T9.1): канонический паттерн панели версии для слабовидящих
     (ГОСТ Р 52872). Порт src/blocks/vi/vi-panel.html career-portal: классы
     ui-vi-*, JS-хуки data-ui-vi-* (ADR-0005). Панель ставится первым
     элементом <body>; без режима скрыта (hidden), модуль a11y/vi.js
     (window.IraoUI.vi) раскрывает её при входе и синхронизирует aria-pressed.
     Сегментные кнопки несут aria-label: визуальные «Аа»/«A» свотчей —
     декоративные (aria-hidden), имя кнопки — название варианта. Кнопка входа
     в режим (data-ui-vi-toggle) в сайтах живёт в шапке — header-паттерн
     (T7.6); CSS панели — a11y/vi.css, отдельный dist/ui-vi.min.css. -->
<div class="ui-vi-bar" data-ui-vi-panel hidden>
  <div class="ui-vi-bar__inner">
    <div class="ui-vi-group" role="group" aria-label="Размер шрифта">
      <span class="ui-vi-group__label">Шрифт</span>
      <div class="ui-vi-seg">
        <button
          class="ui-vi-seg__btn ui-vi-seg__btn--sm"
          type="button"
          data-ui-vi-set="size:sm"
          aria-pressed="false"
          aria-label="Мелкий шрифт"
        >
          A
        </button>
        <button
          class="ui-vi-seg__btn ui-vi-seg__btn--md"
          type="button"
          data-ui-vi-set="size:md"
          aria-pressed="true"
          aria-label="Средний шрифт"
        >
          A
        </button>
        <button
          class="ui-vi-seg__btn ui-vi-seg__btn--lg"
          type="button"
          data-ui-vi-set="size:lg"
          aria-pressed="false"
          aria-label="Крупный шрифт"
        >
          A
        </button>
      </div>
    </div>

    <div class="ui-vi-group" role="group" aria-label="Цвета сайта">
      <span class="ui-vi-group__label">Цвета</span>
      <div class="ui-vi-seg">
        <button
          class="ui-vi-seg__btn"
          type="button"
          data-ui-vi-set="theme:baw"
          aria-pressed="true"
          title="Чёрным по белому"
          aria-label="Чёрным по белому"
        >
          <span class="ui-vi-swatch ui-vi-swatch--baw" aria-hidden="true">Аа</span>
        </button>
        <button
          class="ui-vi-seg__btn"
          type="button"
          data-ui-vi-set="theme:wb"
          aria-pressed="false"
          title="Белым по чёрному"
          aria-label="Белым по чёрному"
        >
          <span class="ui-vi-swatch ui-vi-swatch--wb" aria-hidden="true">Аа</span>
        </button>
        <button
          class="ui-vi-seg__btn"
          type="button"
          data-ui-vi-set="theme:bb"
          aria-pressed="false"
          title="Синим по голубому"
          aria-label="Синим по голубому"
        >
          <span class="ui-vi-swatch ui-vi-swatch--bb" aria-hidden="true">Аа</span>
        </button>
        <button
          class="ui-vi-seg__btn"
          type="button"
          data-ui-vi-set="theme:beige"
          aria-pressed="false"
          title="Бежевым по коричневому"
          aria-label="Бежевым по коричневому"
        >
          <span class="ui-vi-swatch ui-vi-swatch--beige" aria-hidden="true">Аа</span>
        </button>
        <button
          class="ui-vi-seg__btn"
          type="button"
          data-ui-vi-set="theme:green"
          aria-pressed="false"
          title="Зелёным на тёмно-коричневом"
          aria-label="Зелёным на тёмно-коричневом"
        >
          <span class="ui-vi-swatch ui-vi-swatch--green" aria-hidden="true">Аа</span>
        </button>
      </div>
    </div>

    <div class="ui-vi-group" role="group" aria-label="Изображения">
      <span class="ui-vi-group__label">Изображения</span>
      <div class="ui-vi-seg">
        <button class="ui-vi-seg__btn" type="button" data-ui-vi-set="img:on" aria-pressed="true">
          обычные
        </button>
        <button class="ui-vi-seg__btn" type="button" data-ui-vi-set="img:gray" aria-pressed="false">
          чёрно-белые
        </button>
        <button class="ui-vi-seg__btn" type="button" data-ui-vi-set="img:off" aria-pressed="false">
          выкл
        </button>
      </div>
    </div>

    <div class="ui-vi-group" role="group" aria-label="Межбуквенный интервал">
      <span class="ui-vi-group__label">Интервал</span>
      <div class="ui-vi-seg">
        <button
          class="ui-vi-seg__btn"
          type="button"
          data-ui-vi-set="kern:normal"
          aria-pressed="true"
        >
          обычный
        </button>
        <button
          class="ui-vi-seg__btn"
          type="button"
          data-ui-vi-set="kern:wide"
          aria-pressed="false"
        >
          широкий
        </button>
      </div>
    </div>

    <button class="ui-vi-exit" type="button" data-ui-vi-toggle>Обычная версия сайта</button>
  </div>
</div>
