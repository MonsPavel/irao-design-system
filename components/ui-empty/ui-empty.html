<!-- ui-empty (T4.8): канонический паттерн пустого состояния. Расширенный
     стенд (сценарии «фильтры ничего не нашли», «поиск без результатов»,
     вариант без медиа) — showcase/pages/ui-empty/index.html; правила
     текстов, слот иллюстрации, связь с ui-error — README.md.
     Заголовок состояния — h2: страница, внутри которой появляется пустое
     состояние, уже имеет h1 (правило спеки T4.8 п.2; сквозная проверка —
     html-validate irao/one-h1 + irao/heading-order по этим же файлам). Вид
     заголовка/текста дают роли типографики (ui-h3, ui-body,
     ui-text--muted) — «классы, а не теги» T3.3. Иллюстрация — svg
     aria-hidden: декоративна, смысл состояния несёт текст (WCAG 1.1.1,
     Accessibility requirements T4.8); размер — атрибутам width/height
     (система размер не навязывает). CTA обязательны (Implementation
     requirements п.3): действие — ui-button, переход — ui-link. Без
     tabindex: состояние появляется в потоке и фокус не ловит
     (Technical considerations T4.8). -->
<div class="ui-empty">
  <svg
    class="ui-empty__media"
    aria-hidden="true"
    focusable="false"
    width="48"
    height="48"
    viewBox="0 0 24 24"
  >
    <circle
      cx="10.5"
      cy="10.5"
      r="6.75"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
    ></circle>
    <path
      d="M7.75 13.25h5.5"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
    ></path>
    <path
      d="m15.5 15.5 4.75 4.75"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
    ></path>
  </svg>
  <h2 class="ui-empty__title ui-h3">Вакансии не найдены</h2>
  <p class="ui-empty__text ui-body ui-text--muted">
    Под выбранные фильтры ничего не подошло. Попробуйте смягчить условия — или посмотрите все
    вакансии.
  </p>
  <div class="ui-empty__actions">
    <button class="ui-button ui-button--primary" type="button">Сбросить фильтры</button>
    <a class="ui-link" href="/vacancies/">Посмотреть все вакансии</a>
  </div>
</div>
