<!-- ui-error (T4.8): канонический паттерн ошибочного состояния — ДВА
     варианта. Полностраничный (--page, 404/500): заголовок — h1, потому что
     состояние занимает страницу, у которой нет своего заголовка (правило
     спеки T4.8 п.2; сквозная проверка — html-validate irao/one-h1 +
     irao/heading-order). Тексты — тон референса career-portal 404.html:
     «Такой страницы нет или она была перемещена. Начните с главной — там
     всё на месте.» — нет вины пользователя, есть следующее действие.
     Крошек в полностраничном состоянии нет — только nav-минимум действий
     (Technical considerations T4.8); 500 — тот же паттерн с другим текстом
     (README.md). Inline-вариант (в секции): заголовок — h2, страница уже
     имеет h1; retry-кнопка — когда повтор имеет смысл (сбой сети), просто
     ссылка — когда повтор бессмыслен (правила — README.md). Иллюстрация
     декоративна (aria-hidden), состояние объясняется текстом; CTA
     обязательны (Implementation requirements п.3); без tabindex —
     состояние появляется в потоке. Вид заголовка/текста — роли
     типографики (ui-h3, ui-body, ui-text--muted). -->
<div class="ui-error ui-error--page">
  <svg
    class="ui-error__media"
    aria-hidden="true"
    focusable="false"
    width="48"
    height="48"
    viewBox="0 0 24 24"
  >
    <path
      d="M12 21.5S5.5 15.9 5.5 10.75a6.5 6.5 0 0 1 13 0C18.5 15.9 12 21.5 12 21.5Z"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linejoin="round"
    ></path>
    <circle
      cx="12"
      cy="10.5"
      r="2.25"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
    ></circle>
  </svg>
  <h1 class="ui-error__title ui-h3">Страница не найдена</h1>
  <p class="ui-error__text ui-body ui-text--muted">
    Такой страницы нет или она была перемещена. Начните с главной — там всё на месте.
  </p>
  <div class="ui-error__actions">
    <a class="ui-button ui-button--primary" href="/">На главную</a>
  </div>
</div>

<div class="ui-error">
