<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>T7.5: текст + role="status" при каждом лоадере — гейт молчит</title>
  </head>
  <body>
    <main>
      <h1>ui-loader: корректная разметка</h1>
      <!-- ПОЗИТИВНЫЙ КОНТРОЛЬ (T7.5): при каждом .ui-loader есть
           .ui-loader__text с role="status" и непустым текстом (база и
           aria-busy-оверлей) — гейт irao/loader-text-status молчит.
           Ожидаемый зелёный. -->
      <div class="ui-loader">
        <svg class="ui-loader__spinner" aria-hidden="true" focusable="false" width="24" height="24" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2.5" pathLength="100" stroke-dasharray="75 25" stroke-linecap="round"></circle>
        </svg>
        <span class="ui-loader__text" role="status">Загрузка…</span>
      </div>
      <div aria-busy="true">
        <div class="ui-loader ui-loader--overlay">
          <svg class="ui-loader__spinner" aria-hidden="true" focusable="false" width="24" height="24" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2.5" pathLength="100" stroke-dasharray="75 25" stroke-linecap="round"></circle>
          </svg>
          <span class="ui-loader__text" role="status">Загружаем вакансии…</span>
        </div>
      </div>
    </main>
  </body>
</html>
