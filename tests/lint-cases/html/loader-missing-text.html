<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>T7.5: лоадер без доступного текста — гейт ловит</title>
  </head>
  <body>
    <main>
      <h1>ui-loader: нарушения правила «не голый спиннер»</h1>
      <!-- НЕГАТИВ (T7.5): два нарушения правила irao/loader-text-status.
           1) голый спиннер — .ui-loader без .ui-loader__text: состояние
              загрузки не объявляется скринридеру (Accessibility requirements);
           2) .ui-loader__text без role="status": текст виден, но смена
              состояния не объявляется живой областью. Ожидаемый красный. -->
      <div class="ui-loader">
        <svg class="ui-loader__spinner" aria-hidden="true" focusable="false" width="24" height="24" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2.5" pathLength="100" stroke-dasharray="75 25" stroke-linecap="round"></circle>
        </svg>
      </div>
      <div class="ui-loader">
        <svg class="ui-loader__spinner" aria-hidden="true" focusable="false" width="24" height="24" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2.5" pathLength="100" stroke-dasharray="75 25" stroke-linecap="round"></circle>
        </svg>
        <span class="ui-loader__text">Загрузка…</span>
      </div>
    </main>
  </body>
</html>
