<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>Позитивный контроль</title>
  </head>
  <body>
    <!-- ПОЗИТИВНЫЙ КОНТРОЛЬ: один h1, label у input, alt у img,
         tabindex не используется. Ожидаемый зелёный: ни одного замечания. -->
    <h1>Форма отклика</h1>
    <form action="/" method="post">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" autocomplete="email" required>
      <button type="submit">Отправить</button>
    </form>
    <img src="logo.svg" alt="Логотип Ирао" width="120" height="32">
  </body>
</html>
