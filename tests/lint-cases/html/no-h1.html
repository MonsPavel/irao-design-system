<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>Фикстура: страница без h1</title>
  </head>
  <body>
    <!-- Негативная фикстура irao/one-h1 (T13.5, rev T3.3): h1 на странице нет
         вовсе — гейт обязан репортить отсутствие заголовка страницы (цель —
         первый заголовок >1), а не только дубли h1 (см. two-h1.html). -->
    <h2>Секция на странице без заголовка страницы</h2>
    <p>Страница начинается сразу с h2 — иерархии SEO-заголовков h1→h2→h3 нет.</p>
  </body>
</html>
