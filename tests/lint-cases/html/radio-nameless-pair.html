<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>Позитивный контроль: радио без name — не группа</title>
  </head>
  <body>
    <!-- ПОЗИТИВНЫЙ КОНТРОЛЬ (T13.9, rev T5.2): радио без name пропускаются.
         Без name браузер не связывает радио в группу (клик не снимает соседа),
         общего имени и роли group нет — проверять fieldset/legend нечего.
         Пустой ключ «» глобального счёта собирал безымянные радио в
         псевдогруппу — ложное срабатывание. Ожидаемый зелёный: ни одного
         замечания irao/radio-group-fieldset. -->
    <h1>Два безымянных радио</h1>

    <label><input type="radio" value="one"> Вариант один</label>
    <label><input type="radio" value="two"> Вариант два</label>
  </body>
</html>
